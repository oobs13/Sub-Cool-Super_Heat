            margin-bottom: 5px;

        .developer-credit {

        .install-prompt {

        @keyframes bounce {

        body[dir="rtl"] .install-prompt {
            animation-name: bounceRTL;
        }

        @keyframes bounceRTL {
            0%, 20%, 50%, 80%, 100% { transform: translateX(50%) translateY(0); }
            40% { transform: translateX(50%) translateY(-10px); }
            60% { transform: translateX(50%) translateY(-5px); }

        .install-prompt button {
            background: white;
            color: var(--secondary);
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;

        body[dir="rtl"] .install-prompt button {
            margin-left: 0;
            margin-right: 5px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container { padding: 1.2rem; }
            .row { flex-direction: column; gap: 0; }
            .result-value { font-size: 2rem; }
            .top-controls { flex-direction: column; align-items: stretch; }
            .control-group { justify-content: center; }
        }

        /* Loading spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

<script>
// ===== TRANSLATIONS =====
const translations = {
    en: {
        appTitle: '❄️ HVAC Pro Calculator',
        appSubtitle: 'Superheat & Subcooling Diagnostic Tool',
        tabSH: '🔥 Superheat',
        tabSC: '💧 Subcooling',
        lblRefrigerant: 'Refrigerant',
        lblPressure: 'Suction Pressure (PSIG)',
        lblTemp: 'Line Temperature (°F)',
        lblAmbient: 'Ambient Temperature',
        btnCalculate: '🔍 Calculate & Diagnose',
        resultTitleSH: 'Superheat Value',
        resultTitleSC: 'Subcooling Value',
        installText: '📱 Install App',
        installBtn: 'Install',
        disclaimer: '⚠️ Warning: Refrigerant handling requires certification. Always fix leaks before adding refrigerant.',
        devCredit: 'Designed by Mohammed Hisham from Iraq 🇮🇶',
        
        tutorialLink: 'How to Take Readings',
  



        refNotes: {

        },

            highSC: '⚠️ High subcooling: System may be OVERCHARGED or have restricted airflow.',
            okSC: '✅ Subcooling in normal range. Charge appears correct.',
            lowSH: '⚠️ Low superheat: Risk of liquid floodback to compressor! May be overcharged.',
            highSH: '⚠️ High superheat: System likely LOW on refrigerant, or restricted metering device.',
            okSH: '✅ Superheat in normal range. Charge appears correct.'
        }
    },
    ar: {
        appTitle: '❄️ حاسبة التكييف الاحترافية',
        appSubtitle: 'أداة تشخيص السوبرهيت والسب كولنج',
        tabSH: '🔥 السوبرهيت',
        tabSC: '💧 السب كولنج',
        lblRefrigerant: 'نوع الغاز',
        lblPressure: 'ضغط السحب (PSIG)',
        lblTemp: 'درجة حرارة الخط (°F)',
        lblAmbient: 'درجة الحرارة المحيطة',
        btnCalculate: '🔍 احسب وشخص',
        resultTitleSH: 'قيمة السوبرهيت',
        resultTitleSC: 'قيمة السب كولنج',
        installText: '📱 ثبت التطبيق',
        installBtn: 'تثبيت',
        disclaimer: '⚠️ تحذير: التعامل مع المبردات يتطلب شهادة. أصلح التسريبات دائماً قبل إضافة الغاز.',
        devCredit: 'من تصميم محمد هشام من العراق 🇮🇶',
        tutorialLink:  'كيفية أخذ القراءات',



        refNotes: {
            R410A: 'غاز تكييف شائع (غير قابل للاشتعال)',
            R22: 'غاز قديم (يتم إيقافه تدريجياً)',
            R134A: 'تكييف السيارات والتبريد المتوسط',
            R404A: 'التبريد التجاري والفريزر',
            R32: '⚠️ قابل للاشتعال! غاز صديق للبيئة'
        },
        advice: {
            lowSC: '⚠️ سب كولنج منخفض: النظام ناقص غاز. افحص التسريبات قبل الإضافة.',
            highSC: '⚠️ سب كولنج مرتفع: النظام قد يكون مفرط الشحن أو هناك انسداد.',
            okSC: '✅ السب كولنج ضمن المعدل الطبيعي. الشحن صحيح.',
            lowSH: '⚠️ سوبرهيت منخفض: خطر عودة سائل للضاغط! قد يكون هناك زيادة في الغاز.',
            highSH: '⚠️ سوبرهيت مرتفع: النظام ناقص غاز أو هناك مشكلة في صمام التمدد.',
            okSH: '✅ السوبرهيت ضمن المعدل الطبيعي. الشحن صحيح.'
        }
    }
};

// ===== GLOBAL VARIABLES =====
let currentMode = 'superheat';
let currentUnits = 'imperial';
let currentLang = 'en';
let deferredPrompt = null;

// ===== PT CHARTS (PSIG → °F) =====
const ptDataF = {
    "R410A": { 100: 32, 110: 36, 118: 40, 120: 41, 130: 46, 140: 51, 150: 55, 160: 59, 170: 63, 180: 67, 190: 71, 200: 75, 250: 92, 300: 107 },
    "R22": { 50: 26, 60: 34, 68: 40, 70: 41, 80: 47, 90: 53, 100: 58, 110: 64, 120: 69, 130: 74, 140: 78, 150: 83, 200: 103 },
    "R134A": { 10: 10, 15: 15, 20: 20, 25: 26, 30: 31, 35: 36, 40: 40, 45: 45, 50: 49, 55: 54, 60: 58, 65: 62, 70: 66 },
    "R404A": { 0: -50, 10: -30, 20: -15, 30: -3, 40: 7, 50: 15, 60: 23, 70: 30, 80: 37, 90: 43, 100: 49, 110: 54, 120: 59, 130: 64, 140: 69, 150: 73, 200: 93, 250: 109, 300: 123 },
    "R32": { 50: 15, 60: 23, 70: 31, 80: 38, 90: 44, 100: 50, 110: 56, 120: 61, 130: 66, 140: 71, 150: 76, 160: 80, 170: 85, 180: 89, 200: 97, 250: 115, 300: 131, 350: 145 }
};

// ===== UNIT CONVERSIONS =====
function fToC(f) { return (f - 32) * 5/9; }
function cToF(c) { return (c * 9/5) + 32; }
function psigToBar(p) { return (p + 14.7) * 0.0689476; }
function barToPsig(b) { return (b / 0.0689476) - 14.7; }

// ===== LANGUAGE & UI =====


function setLanguage(lang) {
    currentLang = lang;
    const t = translations[lang];
    
    // Update buttons
    document.getElementById('enBtn').classList.toggle('active', lang === 'en');
    document.getElementById('arBtn').classList.toggle('active', lang === 'ar');
    
    // Set direction
    document.body.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    document.documentElement.lang = lang;
    
    // Update all text
    document.getElementById('appTitle').textContent = t.appTitle;
    document.getElementById('appSubtitle').textContent = t.appSubtitle;
    document.getElementById('tabSH').textContent = t.tabSH;
    document.getElementById('tabSC').textContent = t.tabSC;
    document.getElementById('lblRefrigerant').textContent = t.lblRefrigerant;
    document.getElementById('lblAmbient').textContent = t.lblAmbient;
    document.getElementById('btnCalculate').textContent = t.btnCalculate;
    document.getElementById('installText').textContent = t.installText;
    document.getElementById('installBtn').textContent = t.installBtn;
    document.getElementById('disclaimer').innerHTML = t.disclaimer;
    document.getElementById('devCredit').textContent = t.devCredit; // Developer Credit
    document.getElementById('tutorialLink').textContent = t.tutorialLink;
    
    updateLabels();
    updateRefNote();
}

function setUnits(units) {
    currentUnits = units;
    document.getElementById('impBtn').classList.toggle('active', units === 'imperial');
    document.getElementById('metBtn').classList.toggle('active', units === 'metric');
    document.getElementById('ambientUnit').textContent = units === 'imperial' ? '(°F)' : '(°C)';
    document.getElementById('resultUnit').textContent = units === 'imperial' ? '°F' : '°C';
    updateLabels();
    document.getElementById('resultBox').style.display = 'none';
}

function setMode(mode) {
    currentMode = mode;
    document.getElementById('shTab').classList.toggle('active', mode === 'superheat');
    document.getElementById('scTab').classList.toggle('active', mode === 'subcooling');
    updateLabels();
    document.getElementById('resultBox').style.display = 'none';
}

function updateLabels() {
    const t = translations[currentLang];
    const isImp = currentUnits === 'imperial';
    const pUnit = isImp ? 'PSIG' : 'bar';
    const tUnit = isImp ? '°F' : '°C';
    
    if (currentMode === 'superheat') {
        document.getElementById('lblPressure').textContent = `${t.lblPressure.split('(')[0]}(${pUnit})`;
        document.getElementById('lblTemp').textContent = `${t.lblTemp.split('(')[0]}(${tUnit})`;
        document.getElementById('resultTitle').textContent = t.resultTitleSH;
    } else {
        const liquidPress = currentLang === 'ar' ? 'ضغط الخط السائل' : 'Liquid Line Pressure';
        const liquidTemp = currentLang === 'ar' ? 'حرارة الخط السائل' : 'Liquid Line Temp';
        document.getElementById('lblPressure').textContent = `${liquidPress} (${pUnit})`;
        document.getElementById('lblTemp').textContent = `${liquidTemp} (${tUnit})`;
        document.getElementById('resultTitle').textContent = t.resultTitleSC;
    }
}

function updateRefNote() {
    const ref = document.getElementById('refrigerant').value;
    document.getElementById('refNote').textContent = translations[currentLang].refNotes[ref];
}

// ===== CALCULATION =====
function getSatTempF(ref, p) {
    const data = ptDataF[ref];
    if (!data) return null;
    const pressures = Object.keys(data).map(Number).sort((a,b) => a-b);
    if (p <= pressures[0]) return data[pressures[0]];
    if (p >= pressures[pressures.length-1]) return data[pressures[pressures.length-1]];
    for (let i=0; i<pressures.length-1; i++) {
        const p1=pressures[i], p2=pressures[i+1];
        if (p >= p1 && p <= p2) {
            const t1=data[p1], t2=data[p2];
            return t1 + ((p-p1)/(p2-p1))*(t2-t1);
        }
    }
    return null;
}

function calculate() {
    const ref = document.getElementById('refrigerant').value;
    const pIn = parseFloat(document.getElementById('pressure').value);
    const tIn = parseFloat(document.getElementById('lineTemp').value);
    const ambIn = document.getElementById('ambientTemp').value;
    
    if (isNaN(pIn) || isNaN(tIn)) {
        alert(currentLang === 'ar' ? 'أدخل أرقام صحيحة' : 'Please enter valid numbers');
        return;
    }
    
    const pPSIG = currentUnits === 'metric' ? barToPsig(pIn) : pIn;
    const satF = getSatTempF(ref, pPSIG);
    if (!satF) {
        alert(currentLang === 'ar' ? 'الضغط خارج النطاق' : 'Pressure out of range');
        return;
    }
    
    const tF = currentUnits === 'metric' ? cToF(tIn) : tIn;
    const satDisplay = currentUnits === 'metric' ? fToC(satF) : satF;
    
    let resultF = currentMode === 'superheat' ? tF - satF : satF - tF;
    let resultDisplay = currentUnits === 'metric' ? fToC(resultF) : resultF;
    
    // Advice
    const t = translations[currentLang];
    let advice, adviceClass;
    if (currentMode === 'subcooling') {
        if (resultF < 8) { advice = t.advice.lowSC; adviceClass = 'advice-danger'; }
        else if (resultF > 20) { advice = t.advice.highSC; adviceClass = 'advice-warn'; }
        else { advice = t.advice.okSC; adviceClass = 'advice-ok'; }
    } else {
        if (resultF > 20) { advice = t.advice.highSH; adviceClass = 'advice-danger'; }
        else if (resultF < 5) { advice = t.advice.lowSH; adviceClass = 'advice-warn'; }
        else { advice = t.advice.okSH; adviceClass = 'advice-ok'; }
    }
    
    // Display
    document.getElementById('resultBox').style.display = 'block';
    document.getElementById('resultValue').textContent = resultDisplay.toFixed(1);
    document.getElementById('resultValue').style.color = resultF < 0 ? 'var(--danger)' : 'var(--primary)';
    document.getElementById('adviceBox').textContent = advice;
    document.getElementById('adviceBox').className = 'advice-box ' + adviceClass;
    
    const uSym = currentUnits === 'imperial' ? '°F' : '°C';
    const pSym = currentUnits === 'imperial' ? 'PSIG' : 'bar';
    document.getElementById('satDisplay').innerHTML = 
        `<b>${currentLang==='ar'?'درجة التشبع':'Saturation Temp'}:</b> ${satDisplay.toFixed(1)}${uSym} @ ${pIn}${pSym}<br>`+
        `<b>${currentLang==='ar'?'الحرارة المقاسة':'Measured Temp'}:</b> ${tIn}${uSym}`;
}

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installPrompt').style.display = 'flex';
});

window.addEventListener('appinstalled', () => {
    document.getElementById('installPrompt').style.display = 'none';
    deferredPrompt = null;
});

function installApp() {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
                console.log('User accepted install');
            }
            deferredPrompt = null;
            document.getElementById('installPrompt').style.display = 'none';
        });
    }
}

}

    updateLabels();

    }

        inp.addEventListener('keypress', e => { if (e.key === 'Enter') calculate(); });
